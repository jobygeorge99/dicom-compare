# Alembic config. Run alembic commands from the backend/ folder.
#
# The database URL is NOT set here: alembic/env.py reads it from our
# Settings class, so the app and its migrations always use the same database.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Migration file names start with the date, so they sort in order in the folder.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
